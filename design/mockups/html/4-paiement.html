<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Paiement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#0B0F1A}
a{color:#F5B700}a:hover{color:#FFD24D}
</style>
<style>body{display:flex;justify-content:center;background:#05070D;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0F1A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
    <a href="3-zones.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3247; background: #141A2B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="display: flex; flex-direction: column"><div style="font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 22px; line-height: 1">Paiement</div><div style="font-size: 12px; color: #9AA3B8">Places réservées 8 min · 07:42</div></div>
  </div>

  <div style="flex-grow: 1; padding: 6px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <!-- order summary -->
    <div style="padding: 14px 16px; border-radius: 18px; background: #141A2B; border: 1px solid #2A3247; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><div style="color: #C7CDDB">2 × Tribune Nord · Atlas FC vs Rapid Oued</div><div style="font-weight: 600">100 DH</div></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><div style="color: #C7CDDB">Frais de service</div><div style="font-weight: 600">0 DH</div></div>
      <div style="height: 1px; background: #2A3247"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-weight: 600">Total</div><div style="font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 800; font-size: 26px">100 DH</div></div>
    </div>

    <!-- holders -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: #9AA3B8">BILLETS NOMINATIFS</div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #141A2B; border: 1px solid #2A3247">
        <div style="width: 32px; height: 32px; border-radius: 16px; background: #F5B700; color: #0B0F1A; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center">YA</div>
        <div style="flex-grow: 1; font-size: 14px">Billet 1 · <span style="font-weight: 600">Moi</span></div>
        <div style="font-size: 12px; color: #9FD4AE">CIN vérifiée</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #141A2B; border: 1px dashed #4A5370">
        <div style="width: 32px; height: 32px; border-radius: 16px; background: #0B0F1A; border: 1px solid #2A3247; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3B8" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
        <label for="friend" style="flex-grow: 1; font-size: 14px; color: #C7CDDB">Billet 2 · <input id="friend" type="tel" placeholder="numéro WhatsApp de l'ami" style="background: transparent; border: 0; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; width: 190px; outline: none"></label>
      </div>
    </div>

    <!-- payment methods -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: #9AA3B8">MOYEN DE PAIEMENT</div>
      <button style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #141A2B; border: 2px solid #F5B700; color: #FFFFFF; text-align: left; font-family: Inter, sans-serif">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18M7 14h4"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-weight: 600; font-size: 14px">Carte bancaire</div><div style="font-size: 12px; color: #9AA3B8">Payzone · Visa, Mastercard · 3D Secure</div></div>
        <div style="font-size: 12px; color: #9FD4AE">Instantané</div>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #141A2B; border: 2px solid #2A3247; color: #FFFFFF; text-align: left; font-family: Inter, sans-serif">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="7" width="20" height="10" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-weight: 600; font-size: 14px">Cash en agence</div><div style="font-size: 12px; color: #9AA3B8">Code à payer sous 24 h · Wafacash, Cash Plus</div></div>
        <div style="font-size: 12px; color: #9AA3B8">24 h</div>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #141A2B; border: 2px solid #2A3247; color: #FFFFFF; text-align: left; font-family: Inter, sans-serif">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M10 18h4"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-weight: 600; font-size: 14px">Wallet mobile</div><div style="font-size: 12px; color: #9AA3B8">Paiement par numéro de téléphone</div></div>
        <div style="font-size: 12px; color: #9FD4AE">Instantané</div>
      </button>
    </div>
  </div>

  <!-- CTA -->
  <div style="padding: 12px 20px 30px 20px; border-top: 1px solid #2A3247; background: #0B0F1A; display: flex; flex-direction: column; gap: 8px">
    <a href="5-billet.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #F5B700; color: #0B0F1A; font-weight: 600; font-size: 16px; text-decoration: none">Payer 100 DH</a>
    <div style="text-align: center; font-size: 11px; color: #9AA3B8">Billets envoyés dans l'app et sur WhatsApp dès confirmation</div>
  </div>
</div>
</body>
</html>
