name: jomhor_fan
description: Jomhor fan app (tickets, rotating QR, club home).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  jomhor_core:
    path: ../../packages/core
  qr_flutter: ^4.1.0 # latest; it holds its qr dependency at ^3 (qr 4 exists)
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  unorm_dart: ^0.3.3
  wakelock_plus: ^1.8.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
