name: jomhor_fan
description: Jomhor fan app (tickets, rotating QR, club home).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  jomhor_core:
    path: ../../packages/core
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0 # latest; it holds its qr dependency at ^3 (qr 4 exists)
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  unorm_dart: ^0.3.3
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  # design/tokens.json fonts, bundled (SIL OFL 1.1, licences next to the files): no runtime download.
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Arabic (DESIGN.md Lot 4), from github.com/google/fonts (ofl/cairo, ofl/ibmplexsansarabic). Cairo ships as one
    # variable font there; both weights point at it.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 800
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/OFL-BarlowCondensed.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Cairo.txt
    - assets/fonts/OFL-IBMPlexSansArabic.txt

# Launcher icon and native splash (design/BRAND.md "Where the logo appears"). The resources they write under android/
# and ios/ are committed; after a logo change run `dart run flutter_launcher_icons` then `dart run flutter_native_splash:create`.
# assets/brand/*.png are design/logo/jomhor-mark-transparent.svg rasterised (not bundled in the app).
flutter_launcher_icons:
  image_path: ../../design/logo/app-icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B0F1A"
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: assets/brand/mark-foreground.png

flutter_native_splash:
  color: "#0B0F1A"
  image: assets/brand/splash.png
  android_12:
    color: "#0B0F1A"
    image: assets/brand/splash-android12.png
  web: false
