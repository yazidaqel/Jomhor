include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - lib/l10n/app_localizations*.dart
    - lib/data/*.g.dart

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false # the formatter wraps at page_width 120, as in apps/fan

formatter:
  page_width: 120
