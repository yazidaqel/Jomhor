name: jomhor_scanner
description: Jomhor gate scanner (offline validation, sync).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  jomhor_core:
    path: ../../packages/core
  mobile_scanner: ^7.5.0
  timezone: ^0.11.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  sqlite3: ^3.9.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

# Launcher icon and native splash (design/BRAND.md "Where the logo appears"); Android only, as the app. The resources
# they write under android/ are committed; after a logo change run `dart run flutter_launcher_icons` then
# `dart run flutter_native_splash:create`. assets/brand/*.png are design/logo/jomhor-mark-transparent.svg rasterised
# (not bundled in the app).
flutter_launcher_icons:
  image_path: ../../design/logo/app-icon-1024.png
  android: true
  ios: false
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: assets/brand/mark-foreground.png

flutter_native_splash:
  color: "#0B0F1A"
  image: assets/brand/splash.png
  android_12:
    color: "#0B0F1A"
    image: assets/brand/splash-android12.png
  ios: false
  web: false
