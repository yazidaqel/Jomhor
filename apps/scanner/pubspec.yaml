name: jomhor_scanner
description: Jomhor gate scanner (offline validation, sync).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  jomhor_core:
    path: ../../packages/core
  mobile_scanner: ^7.5.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  sqlite3: ^3.9.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
