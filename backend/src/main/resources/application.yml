server:
  servlet:
    context-path: /v1 # docs/04-api.md base; every audience (/fan, /org, /gate, /payments) sits under it

spring:
  application:
    name: jomhor
  datasource:
    # No defaults: outside the dev profile, missing env vars fail startup.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    property-naming-strategy: SNAKE_CASE

jomhor:
  # >= 32 bytes each, from env only. Startup fails if missing or short.
  jwt-secret: ${JWT_SECRET}
  otp-secret: ${OTP_SECRET}
