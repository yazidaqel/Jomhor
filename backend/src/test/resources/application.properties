# Tests call OrderService.expireDue directly; the scheduler stays off in every test context.
jomhor.sales.expiry-cron=-
# Simulated card gateway for every test context (IntegrationTest runs the test profile).
payments.card.provider=fake
payments.public-base-url=http://localhost/v1
payments.fake.secret=test-only-payments-fake-secret-0123456789
payments.fake.late-delay=1s
payments.return-url.web=http://shop.test/orders/{order_id}
payments.return-url.app=jomhor-fan://orders/{order_id}
# Set but empty: no proxy trusted (X-Forwarded-For ignored), and the startup check passes under every profile.
# TrustedProxyIpTest trusts loopback; ClientIpConfigTest starts without this file.
TRUSTED_PROXIES_REGEX=
# Every MockMvc call comes from 127.0.0.1: per-IP limits off except in ClientIpTest, which sets the real ones.
otp.per-ip.fan.sends-10m=1000000
otp.per-ip.fan.sends-24h=1000000
otp.per-ip.org.sends-10m=1000000
otp.per-ip.org.sends-24h=1000000
