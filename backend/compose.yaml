# Local dev database. Dev defaults only; override with env (DB_NAME, DB_USER, DB_PASSWORD).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-jomhor}
      POSTGRES_USER: ${DB_USER:-jomhor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jomhor}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
