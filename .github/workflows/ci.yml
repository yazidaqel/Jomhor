name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_source_chars.py

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backoffice: ${{ steps.filter.outputs.backoffice }}
      core: ${{ steps.filter.outputs.core }}
      fan: ${{ steps.filter.outputs.fan }}
      scanner: ${{ steps.filter.outputs.scanner }}
      shop: ${{ steps.filter.outputs.shop }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/token-vectors.json'
              - 'docs/gate-vectors.json'
              - '.github/workflows/ci.yml'
            backoffice:
              - 'web/backoffice/**'
              - '.github/workflows/ci.yml'
            core:
              - 'packages/core/**'
              - 'docs/token-vectors.json'
              - '.github/workflows/ci.yml'
            fan:
              - 'apps/fan/**'
              - 'packages/core/**'
              - 'design/tokens.json'
              - '.github/workflows/ci.yml'
            scanner:
              - 'apps/scanner/**'
              - 'packages/core/**'
              - 'docs/gate-vectors.json'
              - 'docs/token-vectors.json'
              - 'design/tokens.json'
              - '.github/workflows/ci.yml'
            shop:
              - 'web/shop/**'
              - 'design/tokens.json'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  backoffice:
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/backoffice/package-lock.json
      - run: npm ci
      - run: npm run check

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  fan:
    needs: changes
    if: needs.changes.outputs.fan == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fan
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: flutter test

  scanner:
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scanner
    steps:
      - uses: actions/checkout@v7
      # Skip cleanly until apps/scanner exists (Lot 2 FL tasks create it).
      - id: present
        working-directory: .
        run: if [ -f apps/scanner/pubspec.yaml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "apps/scanner absent, skipping"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: steps.present.outputs.yes == 'true'
        run: flutter pub get
      # The committed Drift code must match schema.drift (build_runner writes 80 columns; the repo formats at 120).
      - if: steps.present.outputs.yes == 'true'
        run: dart run build_runner build --delete-conflicting-outputs && dart format lib/data && git diff --exit-code lib/data
      - if: steps.present.outputs.yes == 'true'
        run: dart format --output=none --set-exit-if-changed lib test tool
      - if: steps.present.outputs.yes == 'true'
        run: flutter analyze --fatal-infos
      - if: steps.present.outputs.yes == 'true'
        run: flutter test -x benchmark
      # Timing gates (p95 < 50 ms) run alone so other test files don't load the runner.
      - if: steps.present.outputs.yes == 'true'
        run: flutter test -t benchmark -j 1

  shop:
    needs: changes
    if: needs.changes.outputs.shop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/shop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/shop/package-lock.json
      - run: npm ci
      - run: npm run check
